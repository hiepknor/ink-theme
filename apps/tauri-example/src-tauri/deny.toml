[advisories]
# Fail unmaintained crates only when Ink selects them directly. Tauri currently
# carries legacy GTK3 and rust-unic crates transitively with no safe upgrade.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
