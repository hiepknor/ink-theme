[package]
name = "ink-tauri-example"
version = "0.1.0"
description = "Ink design system Tauri integration example"
edition = "2021"

[lib]
name = "ink_tauri_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Temporary downstream remediation for RUSTSEC-2024-0429. The vendored source
# is glib 0.18.5 with only upstream gtk-rs/gtk-rs-core#1343 backported.
[patch.crates-io]
glib = { path = "../../../vendor/glib-0.18.5-ink1" }
