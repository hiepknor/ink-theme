version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /apps/tauri-example/src-tauri
    schedule:
      interval: monthly
    groups:
      tauri-runtime:
        patterns: ['tauri*', 'wry', 'webkit2gtk*', 'glib*', 'gtk*']
    open-pull-requests-limit: 3
