version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major upgrades are compatibility projects, not routine maintenance.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Expo owns these versions as a compatibility set. The renderer must
      # also remain exactly aligned with the React version used by Expo.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-test-renderer
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /apps/tauri-example/src-tauri
    schedule:
      interval: monthly
    groups:
      tauri-runtime:
        patterns: ['tauri*', 'wry', 'webkit2gtk*', 'glib*', 'gtk*']
    open-pull-requests-limit: 3
