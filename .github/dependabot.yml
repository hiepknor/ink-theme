version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # This exact version carries a checked-in parser patch and regression
      # test. Major releases remain blocked until the advisory exception and
      # downstream patch are retired together.
      - dependency-name: image-size
        update-types: ['version-update:semver-major']
      # Expo owns these versions as a compatibility set. The renderer must
      # also remain exactly aligned with the React version used by Expo.
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-test-renderer
      # jsdom 30 drops the repository's supported Node 20 runtime.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      # Tooling majors are runtime-contract changes, not routine maintenance.
      - dependency-name: '@testing-library/jest-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /apps/tauri-example/src-tauri
    schedule:
      interval: monthly
    groups:
      tauri-runtime:
        patterns: ['tauri*', 'wry', 'webkit2gtk*', 'glib*', 'gtk*']
    open-pull-requests-limit: 3
