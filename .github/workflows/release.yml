name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'tokens-v*.*.*'
      - 'react-v*.*.*'
      - 'react-native-v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Require a releasable tag
        run: |
          case "$GITHUB_REF_NAME" in
            tokens-v*) PACKAGE_DIR=packages/tokens; TAG_VERSION=${GITHUB_REF_NAME#tokens-v} ;;
            react-native-v*) PACKAGE_DIR=packages/react-native; TAG_VERSION=${GITHUB_REF_NAME#react-native-v} ;;
            react-v*) PACKAGE_DIR=packages/react; TAG_VERSION=${GITHUB_REF_NAME#react-v} ;;
            v*) PACKAGE_DIR=packages/tailwind; TAG_VERSION=${GITHUB_REF_NAME#v} ;;
            *) exit 1 ;;
          esac
          PACKAGE_VERSION=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          grep -F "## $PACKAGE_VERSION" "$PACKAGE_DIR/CHANGELOG.md"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    name: Publish npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Resolve package
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            tokens-v*) PACKAGE_DIR=packages/tokens ;;
            react-native-v*) PACKAGE_DIR=packages/react-native ;;
            react-v*) PACKAGE_DIR=packages/react ;;
            v*) PACKAGE_DIR=packages/tailwind ;;
            *) exit 1 ;;
          esac
          PACKAGE_NAME=$(node -p "require('./$PACKAGE_DIR/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          PACKAGE_BASENAME=${PACKAGE_NAME#@}
          PACKAGE_BASENAME=${PACKAGE_BASENAME//\//-}
          PACKAGE_TARBALL="$RUNNER_TEMP/${PACKAGE_BASENAME}-${PACKAGE_VERSION}.tgz"
          pnpm --filter "$PACKAGE_NAME" pack --out "$PACKAGE_TARBALL"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$PACKAGE_TARBALL" >> "$GITHUB_OUTPUT"
      - name: Check registry
        id: registry
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.name }}"
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          PACKAGE_BASENAME=${PACKAGE_NAME##*/}
          REGISTRY_TARBALL="https://registry.npmjs.org/${PACKAGE_NAME}/-/${PACKAGE_BASENAME}-${PACKAGE_VERSION}.tgz"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1 \
            || curl --fail --silent --head "$REGISTRY_TARBALL" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with provenance
        if: steps.registry.outputs.exists != 'true'
        run: npm publish "${{ steps.package.outputs.tarball }}" --access public --provenance

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            tokens-v*) RELEASE_TITLE="Ink Tokens ${GITHUB_REF_NAME#tokens-v}" ;;
            react-native-v*) RELEASE_TITLE="Ink React Native ${GITHUB_REF_NAME#react-native-v}" ;;
            react-v*) RELEASE_TITLE="Ink React ${GITHUB_REF_NAME#react-v}" ;;
            v*) RELEASE_TITLE="Ink Tailwind ${GITHUB_REF_NAME#v}" ;;
            *) exit 1 ;;
          esac
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$RELEASE_TITLE"
