name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Verify downstream npm security patches
        run: node scripts/check-npm-security-patches.mjs
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          allow-ghsas: GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Pull deterministic Playwright image
        run: |
          for attempt in 1 2 3; do
            docker pull mcr.microsoft.com/playwright:v1.62.1-noble && exit 0
            sleep "$((attempt * 10))"
          done
          exit 1
      - name: Run visual regression in the baseline environment
        run: |
          docker run --rm --ipc=host \
            --volume "$PWD:/work" \
            --workdir /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -lc 'npm install --global pnpm@10.34.5 && pnpm install --frozen-lockfile && pnpm test:visual'

  tauri-integration:
    name: Tauri Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hiepknor/ink-tauri-example build
      - run: cargo check --locked --manifest-path apps/tauri-example/src-tauri/Cargo.toml

  rust-security:
    name: Rust Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Verify downstream security patch and expiry
        run: node scripts/check-rust-security-patch.mjs
      - name: Audit RustSec advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/tauri-example/src-tauri
          ignore: RUSTSEC-2024-0429
      - name: Enforce Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: apps/tauri-example/src-tauri/Cargo.toml
          arguments: --all-features --config apps/tauri-example/src-tauri/deny.toml
          command: check
          command-arguments: advisories bans sources

  native-architecture:
    name: Native Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hiepknor/ink-ui-native check
      - run: pnpm --filter @hiepknor/ink-ui-native test
      - run: pnpm --filter @hiepknor/ink-ui-native pack:check
      - run: pnpm --filter @hiepknor/ink-native-workbench check
      - run: pnpm --filter @hiepknor/ink-native-workbench test
      - name: Audit production npm dependencies
        run: pnpm audit --prod --audit-level high --ignore GHSA-w3rx-r6r6-pgpr --ignore GHSA-5p2g-fcmc-qvqq
      - run: pnpm --filter @hiepknor/ink-native-workbench build:expo

  gate:
    name: CI Gate
    if: always()
    needs: [verify, dependency-review, visual-regression, tauri-integration, rust-security, native-architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI check
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          VISUAL_RESULT: ${{ needs.visual-regression.result }}
          TAURI_RESULT: ${{ needs.tauri-integration.result }}
          RUST_SECURITY_RESULT: ${{ needs.rust-security.result }}
          NATIVE_RESULT: ${{ needs.native-architecture.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          test "$VISUAL_RESULT" = "success"
          test "$TAURI_RESULT" = "success"
          test "$RUST_SECURITY_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
